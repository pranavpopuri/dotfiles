command_timeout = 1000

# Prompt layout: dir + git only (user@host reappears over SSH).
# Language version modules ("via  v1.2.3", etc.) are omitted, except the
# python module which is configured below to show only the active venv name.
format = "$username$hostname$directory$python$git_branch$git_status$character"

